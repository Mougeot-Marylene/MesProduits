<div class="container">
    <div class="card shadow mb-4">
        <div class="card-body">
            <table>
                <thead>
                    <tr>
                        <th>Liste de Produits</th>
                    </tr>
                </thead>
                <!-- track => identifie chaque élément de façon unique pour qu'Angular sache quel produit a changé, sans tout redessiner à chaque mise à jour de la liste  -->
                @for(produit of produits; track produit ){
                <tbody>
                    <tr>
                        <td>{{produit}}</td>
                    </tr>
                </tbody>
                }
            </table>
        </div>
    </div>
</div>
